<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 Programadores Dijeron — Público</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/publico.css">
</head>
<body>

<section class="duelo-pub">
  <div class="duelo-pub__versus">
    <div class="duelo-pub__side" id="side1">
      <div class="duelo-pub__player-name" id="pubPlayer1"></div>
      <div class="mono duelo-pub__winner-badge" id="winnerBadge1" hidden>GANADOR</div>
    </div>
    <div class="mono duelo-pub__vs">VS</div>
    <div class="duelo-pub__side" id="side2">
      <div class="duelo-pub__player-name" id="pubPlayer2"></div>
      <div class="mono duelo-pub__winner-badge" id="winnerBadge2" hidden>GANADOR</div>
    </div>
  </div>

  <div class="duelo-pub__challenge">
    <div class="duelo-pub__challenge-head">
      <div class="duelo-pub__challenge-name" id="pubChallengeName"></div>
      <div class="mono duelo-pub__lang-badge" id="pubLanguageBadge"></div>
    </div>
    <div class="duelo-pub__challenge-statement" id="pubChallengeStatement"></div>
    <div class="duelo-pub__samples" id="pubChallengeSamples"></div>
  </div>

  <div class="duelo-pub__flash" id="flashOverlay" hidden></div>
  <div class="duelo-pub__confetti" id="confettiLayer"></div>
</section>

<script src="data/duelo-defaults.js"></script>
<script src="js/broadcast.js"></script>
<script src="js/duelo-store.js"></script>
<script src="js/publico-duelo.js"></script>
</body>
</html>
